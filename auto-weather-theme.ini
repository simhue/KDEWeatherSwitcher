[weather-theme]
# Aachen, Germany. Change these coordinates to select another location.
latitude = 50.7753
longitude = 6.0839

# Names from: plasma-apply-colorscheme --list-schemes
light_scheme = BreezeLight
dark_scheme = BreezeDark

# Switch to dark at 80% clouds; switch back to light at 60%.
# Between these thresholds, retain the previous selection.
dark_cloud_percent = 80
light_cloud_percent = 60
interval_seconds = 300
